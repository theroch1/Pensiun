<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pendataan & Generate SK Pensiun</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ================= SECTION LOGIN ================= -->
  <div id="loginSection" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow border-0 rounded-4 mt-5">
          <div class="card-body p-4 p-md-5">
            <h3 class="text-center mb-4 fw-bold">Login Admin Pensiun</h3>
            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Masuk</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= DASHBOARD UTAMA ================= -->
  <div id="mainDashboard" class="container-fluid py-4 d-none">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded-3 shadow-sm mb-4 px-3">
      <a class="navbar-brand fw-bold" href="#"><i class="bi bi-file-earmark-text me-2"></i>E-Pensiun</a>
      <div class="ms-auto d-flex align-items-center text-white">
        <span class="me-3"><i class="bi bi-person-circle me-1"></i> <span id="userDisplay">Admin</span></span>
        <button class="btn btn-outline-light btn-sm" onclick="handleLogout()"><i class="bi bi-box-arrow-right"></i> Keluar</button>
      </div>
    </nav>

    <!-- Kartu Statistik -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-primary text-white p-3">
          <h6 class="text-uppercase small">Total Pegawai</h6>
          <h2 id="statTotalPegawai" class="fw-bold mb-0">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-warning text-dark p-3">
          <h6 class="text-uppercase small">Pensiun 2 Bulan Ke Depan</h6>
          <h2 id="statPensiun2Bulan" class="fw-bold mb-0">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-success text-white p-3">
          <h6 class="text-uppercase small">Pensiun Tahun Ini</h6>
          <h2 id="statPensiunTahunIni" class="fw-bold mb-0">0</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm bg-danger text-white p-3">
          <h6 class="text-uppercase small">Belum Ada SK</h6>
          <h2 id="statSisaPegawai" class="fw-bold mb-0">0</h2>
        </div>
      </div>
    </div>

    <!-- Filter & Tabel Pegawai -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <input type="text" id="filterSearch" class="form-control" placeholder="Cari NIP / Nama..." onkeyup="applyFilters()">
          </div>
          <div class="col-md-3">
            <input type="date" id="filterTmtPensiun" class="form-control" onchange="applyFilters()">
          </div>
          <div class="col-md-3">
            <select id="filterStatusSk" class="form-select" onchange="applyFilters()">
              <option value="">Semua Status SK</option>
              <option value="SUDAH">Sudah SK</option>
              <option value="BELUM">Belum SK</option>
            </select>
          </div>
          <div class="col-md-2 d-flex gap-2">
            <button class="btn btn-secondary w-100" onclick="resetFilters()"><i class="bi bi-arrow-counterclockwise"></i></button>
            <button class="btn btn-success w-100" onclick="exportToExcel()" title="Export CSV"><i class="bi bi-file-earmark-excel"></i></button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>No</th>
                <th>NIP</th>
                <th>Nama</th>
                <th>Jabatan</th>
                <th>Jenis</th>
                <th>Tgl Lahir</th>
                <th>Ulang Tahun BUP</th>
                <th>TMT Pensiun</th>
                <th>Masa Kerja</th>
                <th>Status SK</th>
                <th class="text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="pegawaiTbody">
              <!-- Data dimuat dinamis oleh JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= MODAL GENERATE SK ================= -->
  <div class="modal fade" id="skModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Form Generate SK Pensiun</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="generateSkForm">
          <div class="modal-body">
            <input type="hidden" id="modalNip">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nama Pegawai</label>
                <input type="text" class="form-control" id="modalNama" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label">Jabatan</label>
                <input type="text" class="form-control" id="modalJabatan">
              </div>
              <div class="col-md-4">
                <label class="form-label">Jenis Pegawai</label>
                <input type="text" class="form-control" id="modalJenisPegawai">
              </div>
              <div class="col-md-4">
                <label class="form-label">Perangkat Daerah</label>
                <input type="text" class="form-control" id="modalPerangkatDaerah">
              </div>
              <div class="col-md-4">
                <label class="form-label">TMT Pensiun</label>
                <input type="date" class="form-control" id="modalTmtPensiun">
              </div>
              <div class="col-md-6">
                <label class="form-label">Nomor SK</label>
                <input type="text" class="form-control" id="modalNomorSk" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Tanggal SK</label>
                <input type="date" class="form-control" id="modalTanggalSk" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Nomor Pertek BKN</label>
                <input type="text" class="form-control" id="modalNomorPertek">
              </div>
              <div class="col-md-6">
                <label class="form-label">Tanggal Pertek BKN</label>
                <input type="date" class="form-control" id="modalTanggalPertek">
              </div>
              <div class="col-md-6">
                <label class="form-label">Gaji Pokok Terakhir</label>
                <input type="number" class="form-control" id="modalGajiPokok" value="0">
              </div>
              <div class="col-md-6">
                <label class="form-label">Alamat</label>
                <input type="text" class="form-control" id="modalAlamat">
              </div>
              <!-- Hidden fields tambahan untuk kalkulasi -->
              <input type="hidden" id="modalTanggalLahir">
              <input type="hidden" id="modalTanggalUlangTahunBup">
              <input type="hidden" id="modalMasaKerjaTahun">
              <input type="hidden" id="modalMasaKerjaBulan">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-primary">Proses & Buat SK</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script Utama -->
  <script src="app.js?v=3.0"></script>
</body>
</html>
